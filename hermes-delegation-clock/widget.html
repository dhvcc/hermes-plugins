<style>
body{margin:0;font:14px -apple-system,system-ui,sans-serif;color:var(--tg-theme-text-color,#eee);background:var(--tg-theme-bg-color,#17171a)}
#w{padding:6px 12px 4px}
.r{display:flex;align-items:center;gap:10px;padding:7px 0}
.r svg{flex:none}
.x{flex:1;min-width:0}
.n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m{font-size:12px;color:var(--tg-theme-hint-color,#999);margin-top:1px}
.w{font-size:12px;color:#ff5a50;margin-top:1px}
.s{font-size:13px;color:var(--tg-theme-hint-color,#999);white-space:nowrap}
.f .n{font-weight:500;opacity:.8}
.red{color:#ff5a50}.ok{color:#4cc46f}
</style>
<div id="w"></div>
<script>
var W=window.TelegramWidget,T=__STRINGS__;
function e(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function mm(s){return Math.max(1,Math.round(s/60))}
function ring(p,c,done){var C=69.1,d=Math.min(1,p)*C;
return '<svg width="28" height="28" viewBox="0 0 28 28"><circle cx="14" cy="14" r="11" fill="none" stroke="rgba(128,128,128,.25)" stroke-width="3"/>'+
(done?'<circle cx="14" cy="14" r="11" fill="none" stroke="'+c+'" stroke-width="3"/><path d="M9 14.5l3 3 6.5-6.5" stroke="'+c+'" stroke-width="2.2" fill="none" stroke-linecap="round"/>':
'<circle cx="14" cy="14" r="11" fill="none" stroke="'+c+'" stroke-width="3" stroke-linecap="round" stroke-dasharray="'+d.toFixed(1)+' 70" transform="rotate(-90 14 14)"/>')+'</svg>'}
function draw(){var d=null;try{d=JSON.parse(W&&W.chatData)}catch(x){}
var h='';(d&&d.r||[]).forEach(function(r){
var st=r[1],el=r[3],eta=r[4],end=r[6],rep=r[7],live=!end,over=live&&el>eta,bad=st=='a'||st=='e'||over,done=st=='d';
var col=done?'#4cc46f':st=='s'?'#8a8a92':bad?'#ff5a50':'#409cff';
var right=live?(over?'<span class="s red">+'+mm(el-eta)+' '+T.min+'</span>':'<span class="s">'+T.left.replace('{n}',mm(eta-el))+'</span>'):
rep=='!'?'<span class="s red">'+T.no_reply+'</span>':st=='e'?'<span class="s red">'+T.error+'</span>':st=='s'?'<span class="s">'+T.stopped+'</span>':
rep?'<span class="s ok">'+T.reply+' '+e(rep)+'</span>':'<span class="s ok">'+T.done+'</span>';
var meta=live?T.since+' '+e(r[2])+' · '+mm(el)+' '+T.of+mm(eta)+' '+T.min:e(r[2])+'–'+e(end)+' · '+mm(el)+' '+T.min;
h+='<div class="r'+(live?'':' f')+'">'+ring(live?el/Math.max(eta,1):1,col,done)+'<div class="x"><div class="n">'+e(r[0])+'</div>'+
'<div class="m">'+meta+'</div>'+(r[5]?'<div class="w">'+e(r[5])+'</div>':'')+'</div>'+right+'</div>'});
document.getElementById('w').innerHTML=h||'<div class="m">'+T.empty+'</div>'}
if(W){W.onEvent('chatDataChanged',draw);W.onEvent('themeChanged',draw)}draw();
</script>
